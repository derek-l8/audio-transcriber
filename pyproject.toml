[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "npu-scribe"
version = "0.1.0"
description = "Local audio transcription and AI text cleanup with OpenVINO"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["platformdirs==4.12.2"]

[project.optional-dependencies]
desktop = ["PySide6==6.11.2"]
inference = ["openvino==2026.4.0", "openvino-genai==2026.4.0.0"]
bundle = ["pyinstaller==6.22.3"]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "hypothesis==6.168.3", "ruff==0.16.9", "mypy==2.3.1", "build==1.6.1", "hatchling==1.32.4"]

[project.scripts]
npu-scribe = "npu_scribe.cli:main"
npu-scribe-desktop = "npu_scribe.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/npu_scribe"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/docs", "/packaging", "/scripts", "/host-validation", "/.github",
    "/pyproject.toml", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md",
    "/DEVELOPMENT.md", "/TESTING.md", "/PRIVACY.md", "/ARCHITECTURE.md",
    "/REQUIREMENTS.md", "/DECISIONS.md", "/MODEL_EVALUATION.md", "/.gitignore",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["npu_scribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "endurance: long bounded-memory checks",
    "windows: owner-run Windows checks",
    "live: opt-in tests that use the real network; require NPU_SCRIBE_RUN_LIVE=1",
]

