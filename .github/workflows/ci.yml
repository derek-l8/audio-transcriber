name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            pytest-options: '--ignore=tests/test_desktop.py'
          - os: ubuntu-latest
            python: '3.12'
            pytest-options: '--ignore=tests/test_desktop.py'
          - os: windows-latest
            python: '3.12'
            pytest-options: ''
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,desktop,inference]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest -m "not live" --basetemp .scratch/ci-tests ${{ matrix.pytest-options }}

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python scripts/check_distributions.py dist
      - name: Install wheel outside the checkout into a fresh environment
        shell: bash
        run: |
          python -m venv .scratch/package-venv
          .scratch/package-venv/bin/python -m pip install dist/*.whl
          mkdir -p .scratch/package-smoke
          cd .scratch/package-smoke
          ../package-venv/bin/python ../../scripts/smoke_installed.py installed-smoke
