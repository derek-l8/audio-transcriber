version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      openvino-runtime:
        patterns: [openvino, openvino-genai]
      development-tools:
        patterns: [pytest, pytest-cov, hypothesis, ruff, mypy, build, hatchling]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
